version: "3.8"

services:
  dev:
    build: .
    command: npm run dev -- --ip 0.0.0.0 --port 8787
    ports:
      - "8787:8787"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  test:
    build: .
    command: npm test
    profiles:
      - test
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CI: "true"

volumes:
  node_modules:
