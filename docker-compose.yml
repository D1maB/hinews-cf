version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: sh -c "npx wrangler d1 migrations apply DB --local --config wrangler.dev.toml && npx wrangler dev --config wrangler.dev.toml --ip 0.0.0.0 --port 8787 --test-scheduled --var LOCAL_FEEDS_URL:${LOCAL_FEEDS_URL:-http://feeds:8080} --var FEED_ITEM_LIMIT:${FEED_ITEM_LIMIT:-10} --var AI_PROVIDER:${AI_PROVIDER:-google} --var GEMINI_API_KEY:${GEMINI_API_KEY:-} --var GEMINI_MODEL:${GEMINI_MODEL:-} --var OPENROUTER_API_KEY:${OPENROUTER_API_KEY:-} --var OPENROUTER_MODEL:${OPENROUTER_MODEL:-} --var AI_SCORE_BATCH_SIZE:${AI_SCORE_BATCH_SIZE:-20} --var AI_SCORE_TIMEOUT_MS:${AI_SCORE_TIMEOUT_MS:-30000} --var MIN_SCORE_THRESHOLD:${MIN_SCORE_THRESHOLD:-70}"
    ports:
      - '8787:8787'
    environment:
      CI: 'true'
      LOCAL_FEEDS_URL: ${LOCAL_FEEDS_URL:-http://feeds:8080}
      FEED_ITEM_LIMIT: ${FEED_ITEM_LIMIT:-10}
      AI_PROVIDER: ${AI_PROVIDER:-google}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      AI_SCORE_BATCH_SIZE: ${AI_SCORE_BATCH_SIZE:-20}
      AI_SCORE_TIMEOUT_MS: ${AI_SCORE_TIMEOUT_MS:-30000}
      MIN_SCORE_THRESHOLD: ${MIN_SCORE_THRESHOLD:-70}
    depends_on:
      - feeds
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8787']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  tools:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CI: 'true'
      AI_PROVIDER: ${AI_PROVIDER:-google}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      AI_SCORE_BATCH_SIZE: ${AI_SCORE_BATCH_SIZE:-20}
      AI_SCORE_TIMEOUT_MS: ${AI_SCORE_TIMEOUT_MS:-30000}
      MIN_SCORE_THRESHOLD: ${MIN_SCORE_THRESHOLD:-70}

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: npx tsx --test
    profiles:
      - test
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CI: 'true'

  deploy:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: >
      sh -c "npx wrangler d1 migrations apply DB --remote --config wrangler.toml
      && npx wrangler deploy --config wrangler.toml"
    profiles:
      - deploy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}

  feeds:
    image: busybox:1.37
    command: httpd -f -p 8080 -h /feeds
    volumes:
      - ./feeds:/feeds:ro
    ports:
      - '8788:8080'

volumes:
  node_modules:
