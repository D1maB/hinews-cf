name = "hinews-cf"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Local development scores headlines through a local Ollama model.
# Production defaults to the remote model configured in src/score.js.
[vars]
SCORE_BASE_URL = "http://host.docker.internal:11434/v1"
SCORE_MODEL = "llama3.2:1b"

# Local development reads downloaded feeds through this static assets binding.
# Production uses wrangler.toml, which has no assets binding, so it fetches remotely.
[assets]
directory = "./feeds"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "hinews-cf"
database_id = "local"
migrations_dir = "migrations"
