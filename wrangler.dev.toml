name = "hinews-cf"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Local development reads downloaded feeds through this static assets binding.
# Production uses wrangler.toml, which has no assets binding, so it fetches remotely.
[assets]
directory = "./feeds"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "hinews-cf"
database_id = "local"
migrations_dir = "migrations"
