name = "hinews-cf"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Local development secrets (GEMINI_API_KEY) and variables (GEMINI_MODEL,
# GEMINI_BASE_URL, NEWS_ITEM_COUNT) come from the ignored .dev.vars file and the
# repository-root .env file respectively.
[[d1_databases]]
binding = "DB"
database_name = "hinews-cf"
database_id = "local"
migrations_dir = "migrations"
